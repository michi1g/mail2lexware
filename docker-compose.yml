services:
  mail2lexware:
    image: ghcr.io/michi1g/mail2lexware:latest
    # build: .   # zum lokalen Bauen statt Image aus der Registry
    container_name: mail2lexware
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Berlin
      GUI_PASSWORD: ""   # hier ein eigenes Passwort setzen, nicht ins Repo committen
      # LEXWARE_API_KEY: ""   # optional; alternativ in der GUI unter Einstellungen
      # W2L_ENCRYPTION_KEY: ""   # empfohlen: lange Zufallszeichenfolge, hier eigenen Wert setzen (nicht ins Repo committen)
    volumes:
      - /mnt/user/appdata/mail2lexware:/data
